# ---- Rendering ----
backend = "xrender";
vsync = true;
use-damage = false;          # set to false if you notice flickering/artifacts
log-level = "warn";

# ---- Opacity: global stays opaque, per-app transparency is set by the app ----
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;

# ---- Shadows (offset = -radius keeps the shadow centered) ----
shadow = true;
shadow-radius = 14;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-opacity = 0.35;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Dunst'",
  "_GTK_FRAME_EXTENTS@"
];

# ---- Blur (only visible behind translucent windows, e.g. Alacritty) ----
blur-method = "none";
blur-strength = 8;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ---- Rounded corners ----
corner-radius = 10;
corner-radius-rules = [
  "0:class_g = 'Telegram' && window_type = 'utility'",
  "0:class_g = 'Telegram' && window_type = 'dialog'"
];
rounded-corners-exclude = [
  "window_type = 'popup'",
  "window_type = 'utility'",
  "window_type = 'tooltip'",
  "window_type = 'dropdown_menu'"
];

# ---- Fading ----
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;


# ---- Per-app opacity ----
opacity-rule = [
  "85:class_g = 'dev.zed.Zed'",
 "93:class_g = 'Brave-browser'"
];
