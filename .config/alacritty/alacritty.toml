[general]
import = ["~/.config/alacritty/rose-pine-moon.toml"]

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
opacity = 0.8
decorations = "None"
dynamic_padding = true
padding = { x = 12, y = 10 }

[cursor]
style = { shape = "Beam", blinking = "Off" }

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
